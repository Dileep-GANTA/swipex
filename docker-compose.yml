# =====================================================
# Local development / demo stack
# =====================================================
# One command brings up the API + a Postgres database together:
#
#   docker compose up --build
#
# The API will be at http://localhost:8000
# Postgres will be at localhost:5432 (user: postgres / pass: postgres)

version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch_ai
    ports:
      - "5432:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jobmatch_ai
      SECRET_KEY: jobmatch_secret_key
      ALLOWED_ORIGINS: "*"
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./resumes:/app/resumes

volumes:
  jobmatch_pgdata:
