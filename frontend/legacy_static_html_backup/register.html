<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwipeX | Register</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="auth-body">

<div class="background">

<div class="blur one"></div>
<div class="blur two"></div>
<div class="blur three"></div>

</div>

<div class="login-wrapper">

<div class="hero-section">

<h1>🚀 SwipeX</h1>

<h2>
Create Your Career <br>
Journey with AI
</h2>

<p>

Join thousands of job seekers.

Build your AI profile.

Boost your ATS score.

Get matched with top companies.

</p>

</div>

<div class="auth-card">

<h2>Create Account ✨</h2>

<p>Start your AI powered career journey.</p>

<form id="registerForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<select id="role" required>

<option value="">Select Role</option>

<option value="jobseeker">Job Seeker</option>

<option value="recruiter">Recruiter</option>

</select>

<button type="submit">

Create Account →

</button>

</form>

<div class="bottom-text">

Already have an account?

<a href="/login">

Login

</a>

</div>

</div>

</div>

<script src="/js/config.js"></script>
<script src="/js/script.js"></script>

</body>

</html>
