<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwipeX | Companies</title>

    <link rel="stylesheet" href="/css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<nav class="top-nav">

    <div class="logo">
        🚀 SwipeX
    </div>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>

        <a href="/jobs-page">Jobs</a>

        <a href="/companies">Companies</a>

        <a href="/saved">Saved ❤️</a>

        <a href="/profile">Profile</a>

        <a href="/">Logout</a>

    </div>

</nav>


<section class="jobs-section">

    <div class="jobs-header">

        <h1>
            🏢 Top Companies Hiring
        </h1>

        <p>
            Explore companies and discover opportunities that match your career goals.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="filter-bar">

        <input
            type="text"
            id="companySearch"
            class="search-box"
            placeholder="🔍 Search companies...">

        <select id="companyLocation">

            <option value="">
                🌍 All Locations
            </option>

            <option value="Bangalore">
                Bangalore
            </option>

            <option value="Chennai">
                Chennai
            </option>

            <option value="Hyderabad">
                Hyderabad
            </option>

            <option value="Noida">
                Noida
            </option>

            <option value="Remote">
                Remote
            </option>

        </select>

        <button id="resetCompanies">
            Reset
        </button>

    </div>


    <!-- COMPANY GRID -->

    <div
        class="company-grid"
        id="companyGrid">

        <p>
            Loading companies...
        </p>

    </div>

</section>


<script src="/js/config.js"></script>
<script src="/js/companies.js"></script>

</body>

</html>
