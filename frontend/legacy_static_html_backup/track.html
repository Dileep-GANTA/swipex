<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwipeX | My Applications</title>

    <link rel="stylesheet" href="/css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav class="top-nav">

    <div class="logo">
        🚀 SwipeX
    </div>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>
        <a href="/jobs-page">Jobs</a>
        <a href="/companies">Companies</a>
        <a href="/saved">Saved</a>
        <a href="/track">My Applications</a>
        <a href="/profile">Profile</a>
        <a href="/" id="logoutBtn">Logout</a>

    </div>

</nav>


<!-- =========================
     TRACKING PAGE
========================= -->

<div class="dashboard-container">

    <div class="hero-card">
        <div>
            <h1>📋 Application Tracking</h1>
            <p>Every job you've applied to, saved, and where it stands right now.</p>
        </div>
    </div>


    <!-- STAT CARDS -->
    <div class="dashboard-grid" id="statCards">

        <div class="dashboard-card">
            <h3>🚀 Applied</h3>
            <h1 id="statApplied">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>⭐ Shortlisted</h3>
            <h1 id="statShortlisted">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>✅ Selected</h3>
            <h1 id="statSelected">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>❌ Rejected</h3>
            <h1 id="statRejected">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>🎯 Best Match</h3>
            <h1 id="statBestMatch">0%</h1>
        </div>

        <div class="dashboard-card">
            <h3>❤️ Saved Jobs</h3>
            <h1 id="statSaved">0</h1>
        </div>

    </div>


    <!-- RESUME SCORE TREND CHART -->
    <div class="dashboard-card result-card" style="margin-top:24px;">
        <h3>📈 Resume Score Trend</h3>
        <canvas id="resumeTrendChart" height="90"></canvas>
    </div>


    <!-- FILTER TABS -->
    <div class="filter-bar" style="margin-top:28px;">

        <button class="btn filter-tab active" data-status="">All</button>
        <button class="btn filter-tab" data-status="applied">Applied</button>
        <button class="btn filter-tab" data-status="shortlisted">Shortlisted</button>
        <button class="btn filter-tab" data-status="selected">Selected</button>
        <button class="btn filter-tab" data-status="rejected">Rejected</button>

    </div>


    <!-- APPLICATIONS LIST -->
    <div id="applicationsList" style="margin-top:18px;"></div>

</div>


<script src="/js/config.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/track.js"></script>

</body>

</html>
