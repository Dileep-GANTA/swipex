# =====================================================
# SwipeX - Render Blueprint Configuration
# =====================================================

services:
  # 1. FastAPI Backend Service
  - type: web
    name: swipex-backend-ganta
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Link to the PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: swipex-db-ganta
          property: connectionString

      # Link to the frontend URL for CORS setting
      - key: FRONTEND_URL
        value: https://swipex-frontend-ganta-fbym.onrender.com

      # Python Version
      - key: PYTHON_VERSION
        value: 3.11

  # 2. React Frontend Static Site
  - type: web
    name: swipex-frontend-ganta
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Link to the backend URL for API calls
      - key: REACT_APP_API_URL
        value: https://swipex-backend-ganta.onrender.com

# 3. PostgreSQL Database
databases:
  - name: swipex-db-ganta
    plan: free
    databaseName: swipex_ganta
    user: swipex_user_ganta
