# =====================================================
# SwipeX / JobMatch-AI — Render Blueprint
# =====================================================

services:

  - type: web

    name: jobmatch-ai-backend

    runtime: docker

    plan: free

    branch: main

    dockerfilePath: ./Dockerfile

    dockerContext: .

    envVars:

      # Render PostgreSQL connection
      - key: DATABASE_URL

        fromDatabase:
          name: jobmatch-ai-db
          property: connectionString


      # JWT secret
      - key: SECRET_KEY

        generateValue: true


      # CORS
      - key: ALLOWED_ORIGINS

        value: "*"


      # JWT expiration
      - key: ACCESS_TOKEN_EXPIRE_MINUTES

        value: "60"


    # FastAPI health check
    healthCheckPath: /health


# =====================================================
# POSTGRESQL
# =====================================================

databases:

  - name: jobmatch-ai-db

    plan: free

    databaseName: jobmatch_ai

    user: jobmatch_user